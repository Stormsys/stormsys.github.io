    <style>
      :root { --paper: #f3f3f1; --ink: #242424; --muted: #646464; --signal: #b13c2d; --line: #d3d3ce; --gutter: clamp(22px, 6vw, 88px); }
      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 16px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 2px solid var(--signal); outline-offset: 5px; }
      nav { height: 88px; display: flex; align-items: center; justify-content: space-between; padding-inline: var(--gutter); max-width: 1600px; width: 100%; margin-inline: auto; }
      .wordmark { font-size: 36px; font-weight: 750; letter-spacing: -3px; line-height: 1; padding-block: 12px; }
      .wordmark span, h1 span { color: var(--signal); }
      nav div { display: flex; gap: 30px; font-size: 12px; }
      nav div a { padding-block: 13px; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 64px var(--gutter); max-width: 1600px; width: 100%; margin-inline: auto; }
      .eyebrow { margin: 0; color: var(--signal); font: 500 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.4px; text-transform: uppercase; }
      h1 { margin: 24px 0 32px; font-size: clamp(44px, 7.2vw, 108px); font-weight: 500; letter-spacing: -0.065em; line-height: 1.05; }
      .links { display: flex; flex-wrap: wrap; gap: 12px 32px; font-size: 18px; }
      .links a { color: var(--signal); border-bottom: 1px solid var(--signal); padding-bottom: 8px; }
      .arrow { width: 1.5em; height: 1.5em; margin: -0.25em; vertical-align: -0.2em; }
      @media (max-width: 700px) { nav { height: 78px; } }
    </style>
  </head>
